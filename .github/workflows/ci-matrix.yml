name: CI Compatibility Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-matrix:
    name: Spring Boot ${{ matrix.boot-version }} on Java 21
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot-version: [ "3.2.5", "3.3.5", "3.4.0" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Spring-NWVMC framework (${{ matrix.boot-version }})
        run: >
          mvn -B clean install
          -f controller-to-api-framework/pom.xml
          -Dspring-boot.version=${{ matrix.boot-version }}

      - name: Verify reference implementation (${{ matrix.boot-version }})
        run: >
          mvn -B test
          -f controller-to-api-implementation/pom.xml
          -Dspring-boot.version=${{ matrix.boot-version }}

      - name: Build interactive documentation portal
        working-directory: docs
        run: |
          npm ci
          npm run build
