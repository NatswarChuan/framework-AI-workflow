app:
  framework:
    security:
      jwt-secret: ${JWT_SECRET}
      fail-fast-weak-jwt-secret: true
    query-guardrails:
      max-join-depth: 3
      max-page-size: 100
      enforce-statement-timeout: true
    studio:
      enabled: false
      demo-token-endpoint-enabled: false
      show-i18n-diagnostics: false
      hide-framework-fingerprint: true
