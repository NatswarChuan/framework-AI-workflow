novamart:
  datasource:
    primary-url: jdbc:h2:mem:novamarttestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    replica-url: jdbc:h2:mem:novamarttestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    maximum-pool-size: 10

app:
  framework:
    security:
      jwt-secret: NovaMartIntegrationTestJwtSecretKeyAtLeast32BytesLongHs256
      fail-fast-weak-jwt-secret: true
      database-rbac-cache-ttl-seconds: 1
    storage:
      local:
        base-dir: target/novamart-test-uploads
